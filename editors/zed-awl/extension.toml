id = "awl"
name = "AWL"
description = "AWL workflow language support with Tree-sitter syntax highlighting and the Aion language server"
version = "0.1.0"
schema_version = 1
authors = ["Ablative"]
repository = "https://github.com/ablative-io/aion"

[language_servers.awl]
name = "AWL Language Server"
languages = ["AWL"]
language_ids = { AWL = "awl" }

[grammars.awl]
# Zed does not build the grammar from this repository — it fetches the
# published mirror below at this exact revision. So a change to
# tools/tree-sitter-awl reaches Zed only after that mirror is pushed and this
# `rev` is bumped, and nothing in a Zed user's toolchain can tell that it
# wasn't. `grammar-sha256` digests the grammar sources a mirror commit must be
# carrying for this pin to be current; crates/aion-awl/tests/editor_assets.rs
# recomputes it and fails when the two disagree. Bump both together, and only
# after `git ls-remote` shows the sha anonymously.
repository = "https://github.com/tomWhiting/tree-sitter-awl.git"
rev = "4ba65879406dbe9204138e24397917ba60d82aff"
# grammar-sha256 = "5c659cfa6ced3154ad5a69173b320591b83886f80972ed44f42b5d7db405f859"
