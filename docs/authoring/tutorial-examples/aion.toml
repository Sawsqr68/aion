# The body of the `cat > aion.toml <<EOF` block on the tutorial's config slide.
# The deck READS this file to build that slide, so this is the single source of
# what the tutorial teaches — there is no second copy to drift from.
#
# `$HOME` is deliberate and is expanded BY THE SHELL as the heredoc is written,
# so what lands on disk is already a full path with no username typed by hand.
# Do not "fix" it to a literal path: that is what makes the block paste-able on
# any machine.
#
# The ports are deliberately not 8080/50051, and the worker channel is not the
# common live 50061, so this tutorial cannot collide with servers or workers you
# already have running.

[server]
listen_address = "127.0.0.1:8099"
grpc_address = "127.0.0.1:50099"

[store]
backend = "haematite"
# A FULL path, always. A relative one is resolved against whatever folder you
# started the server from. A `~` does NOT work here — the config file is not a
# shell, so it is taken literally and you get a folder actually named `~`.
data_dir = "$HOME/my-first-flow/aion-data"
# These three are REQUIRED and have no defaults — the server refuses to start
# without them, naming the missing field. "unlimited" is the pre-budget cache
# behaviour stated out loud; write a byte bound (e.g. { bytes = 1073741824 })
# once you know your box. The lock fields are how long a node waits for the
# store lock (patience) and how often it retries meanwhile; cadence <= patience.
node_cache_budget = "unlimited"
lock_acquisition_patience_ms = 250
lock_acquisition_retry_cadence_ms = 5

[runtime]
query_timeout_ms = 10000

[observability]
# Both REQUIRED, no defaults. One durable commit re-persists the whole
# containing storage leaf, so the batch bounds are a write-amplification
# decision: max_batch_events is the most transcript events one durable
# commit carries; max_batch_hold_ms is how long a partial batch may be held
# open (bounds how much not-yet-durable transcript a crash can cost).
max_batch_events = 64
max_batch_hold_ms = 200

[outbox]
# The liminal worker channel the tutorial's worker dials. Without it that
# listener is never bound, and the worker's dial is refused with nothing on
# the server side saying why.
enabled = true
transport = "liminal"
liminal_listen_address = "127.0.0.1:50169"

[websocket]
event_broadcast_capacity = 1024
cluster_broadcast_capacity = 64

[deploy]
enabled = true
max_archive_bytes = 16777216
max_inflated_bytes = 67108864
