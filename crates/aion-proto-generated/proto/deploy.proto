syntax = "proto3";

package aion;

// Operator deploy API: runtime package load, version listing, routing, and
// unload. This is a privileged operator surface, deliberately separate from
// WorkflowService so caller SDK stubs never carry deploy operations
// (CLIENT-CONTRACT: SDKs SHALL NOT expose deploy). Operations are
// engine-global — there is no namespace field anywhere on this surface,
// because a loaded workflow type is startable from every namespace.
service DeployService {
  rpc LoadPackage(LoadPackageRequest) returns (LoadPackageResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc RouteVersion(RouteVersionRequest) returns (RouteVersionResponse);
  rpc UnloadVersion(UnloadVersionRequest) returns (UnloadVersionResponse);
  rpc ListManagedWorkers(ListManagedWorkersRequest) returns (ListManagedWorkersResponse);
  rpc StartManagedWorker(ManagedWorkerRequest) returns (ManagedWorkerResponse);
  rpc StopManagedWorker(ManagedWorkerRequest) returns (ManagedWorkerResponse);
  rpc RestartManagedWorker(ManagedWorkerRequest) returns (ManagedWorkerResponse);
}

// A complete `.aion` archive, uploaded in one unary message. The server
// enforces the operator-configured `[deploy].max_archive_bytes` ceiling.
message LoadPackageRequest {
  bytes archive = 1;
}

// Outcome of a package load. Idempotency is specified behavior: re-sending
// the same archive succeeds with `freshly_loaded = false`, and
// `route_changed` reports whether the call re-pointed routing.
message LoadPackageResponse {
  string workflow_type = 1;
  // Textual ContentHash — the version identifier everywhere on the wire.
  string content_hash = 2;
  string deployed_entry_module = 3;
  string entry_function = 4;
  // False = idempotent re-load (the hash was already resident).
  bool freshly_loaded = 5;
  // False = the hash was already route-active (full no-op).
  bool route_changed = 6;
  // Every OTHER version of this type still resident and no longer routed.
  // Deploy does not remove them and never has: they stay loaded, stay in the
  // durable package table, and stay part of worker-admission contract
  // checking until an operator unloads them. Naming them here is what turns
  // `aion unload <workflow-type> <content-hash>` from a verb nobody knows
  // about into the obvious next step. Empty on a first deploy, and empty
  // once a deploy loop prunes as it goes.
  repeated string superseded_versions = 7;
}

// Engine-global listing; no namespace (the catalog is namespace-blind).
message ListVersionsRequest {}

// One loaded version of one workflow type, mirroring the engine's
// WorkflowVersionInfo listing record.
message WorkflowVersion {
  string workflow_type = 1;
  string content_hash = 2;
  string deployed_entry_module = 3;
  string entry_function = 4;
  string manifest_version = 5;
  // RFC 3339 engine-local load instant.
  string loaded_at = 6;
  bool route_active = 7;
}

message ListVersionsResponse {
  repeated WorkflowVersion versions = 1;
}

// Atomic, idempotent route re-point (rollback / roll-forward).
message RouteVersionRequest {
  string workflow_type = 1;
  string content_hash = 2;
}

message RouteVersionResponse {}

// Unload of a non-routed, unpinned version; refusals are typed
// (`version_pinned`) and name what pins the version.
message UnloadVersionRequest {
  string workflow_type = 1;
  string content_hash = 2;
}

message UnloadVersionResponse {}

// --- Managed worker lifecycle (W-1..W-4) -----------------------------------
//
// The server supervises worker PROCESSES from durable `WorkerDeployment`
// records. These operations sit on the deploy service because that is where
// the records themselves live and because they carry the same deployment-wide
// deploy authority; the read is also served over HTTP at GET /workers/managed
// from the SAME projection, so the two surfaces cannot disagree.

message ListManagedWorkersRequest {}

// One managed worker: durable intent joined with live supervision state.
message ManagedWorker {
  string name = 1;
  string task_queue = 2;
  // Durable operator intent: "running" or "stopped".
  string desired = 3;
  // Live supervision state: starting, running, backoff, stopped, failed, or
  // uncommissioned.
  string state = 4;
  // Present only while a process is running.
  optional uint32 pid = 5;
  optional int32 process_group = 6;
  uint32 restarts = 7;
  // RFC 3339 instant of the last observed ending, when there has been one.
  optional string last_exit_at = 8;
  optional int32 last_exit_code = 9;
  optional int32 last_exit_signal = 10;
  // Whether the supervisor itself asked for that ending.
  bool last_exit_requested = 11;
  optional string last_error = 12;
  // Content hash of the binary named at deploy time.
  string deployed_content_hash = 13;
  // Content hash measured at the most recent spawn. Differing from
  // `deployed_content_hash` is an upgrade, stated rather than silent.
  optional string spawn_content_hash = 14;
  optional string spawn_path = 15;
}

message ListManagedWorkersResponse {
  // False when this server has no `[worker_supervision]` policy.
  bool commissioned = 1;
  // The operator remedy, present exactly when `commissioned` is false.
  optional string remedy = 2;
  repeated ManagedWorker workers = 3;
  // Names of durable rows present but undecodable, supervised by nothing.
  repeated string undecodable = 4;
}

// Every lifecycle mutation addresses one deployment by its primary key.
message ManagedWorkerRequest {
  string name = 1;
}

message ManagedWorkerResponse {
  ManagedWorker worker = 1;
}
