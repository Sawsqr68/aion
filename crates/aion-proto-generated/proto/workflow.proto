syntax = "proto3";

package aion;

import "common.proto";

// Workflow-management API shared by clients and the managed server.
service WorkflowService {
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc Signal(SignalRequest) returns (SignalResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Reopen(ReopenRequest) returns (ReopenResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc CountWorkflows(CountWorkflowsRequest) returns (CountWorkflowsResponse);
  rpc DescribeWorkflow(DescribeWorkflowRequest) returns (DescribeWorkflowResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  rpc PauseSchedule(ScheduleIdRequest) returns (PauseScheduleResponse);
  rpc ResumeSchedule(ScheduleIdRequest) returns (ResumeScheduleResponse);
  rpc DeleteSchedule(ScheduleIdRequest) returns (DeleteScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc DescribeSchedule(ScheduleIdRequest) returns (DescribeScheduleResponse);
  // Mint (or gate) a set of already-authorized namespaces on THIS node.
  //
  // The intra-cluster vehicle for namespace-mint routing: a namespace's
  // registry record hashes to a shard of its own, so a node that does not own
  // that shard forwards the mint here rather than being fenced forever. The
  // receiving node applies its ORDINARY auto-create policy through the same
  // minter a local start uses -- a forwarded mint is exactly as privileged as
  // a local one, never a policy bypass -- and authorizes the caller from the
  // forwarded metadata exactly as any other RPC does.
  rpc MintNamespace(MintNamespaceRequest) returns (MintNamespaceResponse);
}

// How a namespace came to be minted, carried so the owner records the same
// provenance the initiating node would have recorded.
enum NamespaceMintOrigin {
  NAMESPACE_MINT_ORIGIN_UNSPECIFIED = 0;
  NAMESPACE_MINT_ORIGIN_WORKER = 1;
  NAMESPACE_MINT_ORIGIN_START = 2;
  NAMESPACE_MINT_ORIGIN_EXPLICIT = 3;
  NAMESPACE_MINT_ORIGIN_INFERRED_FROM_STATE = 4;
}

message MintNamespaceRequest {
  // The namespace set to mint or gate. Every name is authorized against the
  // caller on the receiving node before anything is written.
  repeated string namespaces = 1;
  // Provenance recorded on a genuinely-new namespace. The unspecified value is
  // refused rather than guessed.
  NamespaceMintOrigin origin = 2;
}

// An empty ack: the mint is idempotent, so "created" and "already existed" are
// the same success to the caller.
message MintNamespaceResponse {}

message StartWorkflowRequest {
  string namespace = 1;
  string workflow_type = 2;
  Payload input = 3;
  // R-4 steered start: caller-chosen routing key. When set, the start is steered
  // to shard_for(routing_key)'s owner (forwarded there if this node is not the
  // owner). Empty/absent keeps the unsteered (R-1 remint) behaviour.
  optional string routing_key = 4;
  // Optional task queue this workflow defaults its activities to (the
  // namespace x task_queue targeting story). When set, it is recorded durably
  // on the start so it survives replay/failover. Empty/absent keeps the
  // namespace's default queue.
  optional string task_queue = 5;
  // Optional operator-facing display name for the run (#211). A LABEL over the
  // UUID identity, never an address: nothing resolves a workflow by name. When
  // set, it is recorded durably (as the aion.display_name search attribute) in
  // the same atomic append as the start. ABSENT (this optional field unset)
  // starts the run unnamed; a PRESENT but blank (empty or whitespace-only)
  // value is REFUSED with invalid_input rather than reinterpreted as unnamed,
  // so leave the field unset to mean "no name" — do not send "". This differs
  // from routing_key and task_queue above, where empty does mean "not
  // selected".
  optional string display_name = 6;
}

message StartWorkflowResponse {
  WorkflowId workflow_id = 1;
  RunId run_id = 2;
}

message SignalRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  RunId run_id = 3;
  string signal_name = 4;
  Payload payload = 5;
}

message SignalResponse {}

message QueryRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  RunId run_id = 3;
  string query_name = 4;
  // Caller-supplied query arguments handed to the workflow's registered query
  // handler. Absent means "no arguments"; the server materializes the JSON
  // `null` document so a handler always receives one well-formed input.
  // Arguments are read-only handler inputs and are never recorded in history.
  Payload arguments = 5;
}

message QueryResponse {
  oneof outcome {
    Payload result = 1;
    WireError error = 2;
  }
}

message CancelRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  RunId run_id = 3;
  string reason = 4;
}

message CancelResponse {}

message ReopenRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  // Optional run id; absent means the latest run.
  RunId run_id = 3;
}

// Reopen returns the reopened run id and its projected status (Running) so the
// caller learns the run is live again — distinct from CancelResponse which is
// an empty ack.
message ReopenResponse {
  RunId run_id = 1;
  WorkflowStatus status = 2;
}

// Pause holds new activity dispatch for a live Running run (#204).
message PauseRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  // Optional run id; absent means the latest run.
  RunId run_id = 3;
  // Optional operator-supplied reason.
  string reason = 4;
}

// Pause returns the run id and its projected status (Paused).
message PauseResponse {
  RunId run_id = 1;
  WorkflowStatus status = 2;
}

// Resume releases the dispatch hold on a Paused run (#204).
message ResumeRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  // Optional run id; absent means the latest run.
  RunId run_id = 3;
}

// Resume returns the run id and its projected status (Running).
message ResumeResponse {
  RunId run_id = 1;
  WorkflowStatus status = 2;
}

// Rename records a new operator-facing display name for a run (#211). The name
// is a label over the UUID identity, never an address; every rename is a
// RECORDED SearchAttributesUpdated event, so history keeps every name the run
// has worn.
message RenameRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  // Optional run id; absent means the latest run.
  RunId run_id = 3;
  // The new display name. Trimmed by the server; must be non-empty after
  // trimming.
  string display_name = 4;
}

// Rename returns the run id and the display name as recorded (trimmed).
message RenameResponse {
  RunId run_id = 1;
  string display_name = 2;
}

message ListWorkflowsRequest {
  string namespace = 1;
  // Serde-encoded aion_store::visibility::ListWorkflowsFilter.
  WireEnvelope filter = 2;
}

message ListWorkflowsResponse {
  // Serde-encoded aion_store::visibility::WorkflowSummary values.
  repeated WireEnvelope summaries = 1;
}

message CountWorkflowsRequest {
  string namespace = 1;
  // Serde-encoded aion_store::visibility::ListWorkflowsFilter.
  WireEnvelope filter = 2;
}

message CountWorkflowsResponse {
  uint64 count = 1;
}

message DescribeWorkflowRequest {
  string namespace = 1;
  WorkflowId workflow_id = 2;
  RunId run_id = 3;
  bool include_history = 4;
}

message DescribeWorkflowResponse {
  WireEnvelope summary = 1;
  repeated WireEnvelope history = 2;
}

message CreateScheduleRequest {
  string namespace = 1;
  WireEnvelope config = 2;
}

message CreateScheduleResponse {
  ScheduleId schedule_id = 1;
  WireEnvelope state = 2;
}

message UpdateScheduleRequest {
  string namespace = 1;
  ScheduleId schedule_id = 2;
  WireEnvelope config = 3;
}

message UpdateScheduleResponse {
  WireEnvelope state = 1;
}

message ScheduleIdRequest {
  string namespace = 1;
  ScheduleId schedule_id = 2;
}

message PauseScheduleResponse {
  WireEnvelope state = 1;
}

message ResumeScheduleResponse {
  WireEnvelope state = 1;
}

message DeleteScheduleResponse {}

message ListSchedulesRequest {
  string namespace = 1;
}

message ListSchedulesResponse {
  repeated WireEnvelope schedules = 1;
}

message DescribeScheduleResponse {
  WireEnvelope state = 1;
}
