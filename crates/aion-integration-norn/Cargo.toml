[package]
name = "aion-integration-norn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The first-party Norn adapter for Aion: implements the aion-integrations AgentHarness trait against a Norn `--protocol jsonrpc` process. The single place that names Norn's on-wire contract."
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/aion-integration-norn"
readme = "README.md"
keywords = ["aion", "agent", "harness", "norn", "integration"]
categories = ["api-bindings", "asynchronous"]

[lints]
workspace = true

[dependencies]
aion-core = { version = "0.22.0", path = "../aion-core" }
aion-integrations = { version = "0.22.0", path = "../aion-integrations" }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
nix = { version = "0.30", features = ["signal"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
] }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
futures = { workspace = true }
# The declared-environment pin spawns a REAL child that writes its own environment to a
# file; the sandbox that file lives in is a temporary directory, cleaned up with the test.
# The `cwd` gate uses one too: a directory that exists and one that does not are both
# facts about the filesystem, and a scratch root is how a test states either without
# depending on what happens to be on the box.
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
uuid = { workspace = true }
