# Aion server configuration.
#
# Written by `aion server` on a first start that found no config at any
# discovery layer — an explicit `--config PATH`, a project-local `./aion.toml`,
# then this file, `<AION_HOME>/config.toml` (AION_HOME defaults to `~/.aion`).
# Yours to edit; the server never rewrites an existing file.
# Reference: https://github.com/ablative-io/aion/blob/main/docs/operations/operations.md
#
# Some keys have an `AION_<SECTION>_<KEY>` environment override (for example
# `AION_RUNTIME_QUERY_TIMEOUT_MS=10000`) which wins over this file; overrides
# are an explicit allowlist, listed in full in the operations guide under
# "Environment overrides". Command-line flags win over both.

[server]
listen_address = "127.0.0.1:8080"   # HTTP/JSON API + ops console
grpc_address = "127.0.0.1:50051"    # gRPC API + worker protocol

[store]
backend = "haematite"               # durable ablative event store (the default)
# The node cache's BYTE ceiling. REQUIRED — the server refuses to start
# without it, because a node is not a fixed-size thing (a leaf reaches the
# ~96KB class) and a cache bounded only by its entry count is unbounded in
# bytes: a 1,024-entry cache can hold gigabytes of fat leaves.
#
# `unlimited` is the pre-budget behaviour, written out loud so that choosing
# it is visible here and in a diff. It is what this scaffold ships because
# only the operator knows how much resident memory this process may spend on
# cached nodes — nothing here invents that number for you. SET A CEILING
# once you know your box, e.g.:
#   node_cache_budget = { bytes = 1073741824 }   # 1 GiB
node_cache_budget = "unlimited"
# The data directory's writer lock needs no configuration: it is a
# kernel-released flock, so its holder is either a live process (a draining
# predecessor mid-handover, or another server on this data directory — the
# boot waits and REPORTS AT INTERVALS naming the lock, so a log tail shows a
# handover in progress, never a silent hang) or already dead, in which case
# the kernel has released it and the boot proceeds at once. Two live writers
# still cannot coexist — the waiter never opens while the lock is held. If a
# boot reports waiting and you expected no other server, find the holder:
#   lsof <data_dir>/writer.lock
# (The former lock_acquisition_patience_ms / lock_acquisition_retry_cadence_ms
# keys are retired: a patience ceiling only converted slow handovers into
# refused boots. If your file still carries them they are warned and ignored,
# never refused.)
# The database directory defaults to `<AION_HOME>/data`, created on start.
# One legacy exception: when AION_HOME is unset (a derived home) and a real
# `./aion-data` directory sits in the server's working directory, that
# directory is adopted and logged; an explicit AION_HOME ignores it.
# Set `data_dir` only to relocate the database: use an absolute path whose
# ancestor chain is owner-only (a relative path resolves against the server's
# working directory; a leading `~` expands against $HOME).
# shard_count = 64                  # shards on a fresh database (default 64)
#
# Ephemeral only — in-memory store, loses all state on stop:
#   backend = "memory"

[runtime]
# Reply deadline for workflow queries, in milliseconds (default 10000).
query_timeout_ms = 10000

[outbox]
# Commissions the durable outbox, which hosts the liminal worker channel that
# remote workers (`aion worker agent`, the assistant worker) connect IN to.
# That surface ships dark by default; without it the listener is never bound
# and a liminal worker's dial is refused, forever, with nothing on the server
# side saying why. Enabled here so a first-run server can serve workers.
# Requires a durable store: with `backend = "memory"` above, set
# `enabled = false` or the server refuses to boot.
# A build without the `liminal-transport` feature must set `transport = "grpc"`
# here; leaving `liminal` is a boot-time configuration error.
enabled = true
transport = "liminal"
liminal_listen_address = "127.0.0.1:50061"

[websocket]
# Capacity of the global live-event broadcast channel (default 256).
event_broadcast_capacity = 1024
# Capacity of the WS3 cluster topology broadcast channel (always mounted on
# /events/stream; default 64). Cluster events are low-rate, so keep small.
cluster_broadcast_capacity = 64

[observability]
# The agent-transcript drain's flush policy. BOTH KEYS ARE REQUIRED and have no
# default: the server refuses to start without them, on purpose, because they
# are a deployment trade nobody can make for you.
#
# Why they exist: every durable transcript commit re-persists its whole
# containing storage leaf as a new permanent blob. Committing one event at a
# time therefore makes a run's store cost scale with its event COUNT, not its
# bytes — measured 2026-08-17, a 136 KB status sweep left 73.7 MB of permanent
# store. Batching divides that count.
#
# max_batch_events: the most transcript events one durable commit carries.
# Bigger means fewer commits (less store) and more events in one commit — so a
# single refused commit loses more, and more events sit in memory at once
# (~17 KB each at the measured average, so 64 is ~1 MB in flight).
max_batch_events = 64
# max_batch_hold_ms: how long a PARTIAL batch may be held open waiting to fill.
# This is the only durability-timing knob here: transcript events already wait
# in an in-memory queue and are already lost if the process dies; this bounds
# how much LONGER they may wait, and so how much transcript a kill -9 can cost.
# It also bounds how far the live transcript tail lags. 0 means never wait —
# only events that genuinely arrived together share a commit, with no added
# window at all. The transcript is observability, never workflow replay
# authority, which is the only reason this trade is offered.
max_batch_hold_ms = 200

[deploy]
# Runtime package deploy/route/unload: lets `aion deploy` reach this server.
# Deploying is running code on this server, which is why the surface ships
# dark by default. It listens on the localhost addresses above, so it is
# reachable by whoever can already run commands on this machine; on a shared
# or multi-user box, decide deliberately whether that set is the set you
# want, and disable this when you are done deploying.
# When enabled, both ceilings default to conservative security limits (64 MiB
# archive / 256 MiB inflated) so enabling deploy boots without sizing them.
# When set, max_inflated_bytes must be >= max_archive_bytes (an explicit 0 is
# rejected).
enabled = true
max_archive_bytes = 16777216        # 16 MiB upload ceiling
max_inflated_bytes = 67108864       # 64 MiB decompressed-contents ceiling
