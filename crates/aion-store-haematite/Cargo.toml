[package]
name = "aion-store-haematite"
version.workspace = true
edition.workspace = true
# The indefinite writer-lock wait probes lock availability with std's
# `File::try_lock`, stabilized in 1.89 — the safe alternative to a libc flock
# in a workspace that denies unsafe. The workspace floor is 1.89 for the same
# API family now, so the override this crate carried alone is retired.
rust-version.workspace = true
description = "Single-node haematite-backed event store implementation for Aion workflows."
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/aion-store-haematite"
keywords = ["aion", "workflow", "durable-execution", "haematite", "event-store"]
categories = ["asynchronous", "database"]

[lints]
workspace = true

[dependencies]
aion-store = { version = "0.23.0", path = "../aion-store" }
aion-core = { version = "0.23.0", path = "../aion-core" }
haematite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
