name: ci

# THE full-gate keystone CI. Mirrors the LOCAL bar exactly so regressions like
# the #157 kill-9 failover quorum bug cannot rot in unnoticed (the repo
# previously had only ops-console-embed.yml — no fmt/clippy/test gate).
#
# Toolchain is pinned by rust-toolchain.toml (stable + rustfmt + clippy,
# edition 2024, rust-version 1.85; no nightly). The clippy bar matches the
# local one: clippy::all + pedantic = deny and unwrap_used/expect_used/panic =
# deny, configured in the workspace lints — so a plain `-D warnings` enforces it.
#
# Two lanes:
#   FAST   — fmt / clippy / test on every push-to-main and PR.
#   SLOW   — the two real OS-process kill-9 failover gates. These spin up 3-node
#            clusters and hard-kill a node, so they run nightly + on demand, and
#            on PRs that touch the failover-critical code (paths filter below).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 04:17 UTC — runs the slow kill-9 failover gates.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether a PR touches the failover-critical code. Used to decide
  # whether the slow kill-9 lane should run on that PR (it always runs on
  # schedule / workflow_dispatch / push-to-main). Cheap; no toolchain needed.
  changes:
    name: detect failover-critical changes
    runs-on: ubuntu-latest
    outputs:
      failover: ${{ steps.filter.outputs.failover }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            failover:
              - 'crates/aion/**'
              - 'crates/aion-server/**'
              - 'crates/aion-store/**'
              - 'crates/aion-store-haematite/**'
              - 'crates/aion-worker/**'
              - 'crates/aion-cli/tests/**'

  # ----------------------------------------------------------------------- #
  # FAST LANE — runs on every push-to-main and every PR.
  # ----------------------------------------------------------------------- #

  fmt:
    name: fmt (cargo fmt --all --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # SEPARATE JOB, deliberately — see the comment on `test-all-features` below.
  # Non-default features are their own coverage dimension and get their own status.
  clippy-all-features:
    name: clippy (-D warnings, --all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  no-norn-in-platform:
    name: no-norn-in-platform (§3A.4 invariant gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Asserts the platform crates carry ZERO Norn coupling: no cargo-tree
      # dependency edge to aion-integration-norn/norn*, and no norn-crate
      # identifier in platform src (allowlisting the doc-comments + test
      # fixtures). Fails the instant a norn edge is added to a platform crate.
      - name: cargo xtask no-norn-in-platform
        run: cargo xtask no-norn-in-platform

  no-bypasses-aion-awl:
    name: aion-awl zero-bypass guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the crate free of lint/test bypasses and textual source splices.
      # The directory assertion prevents a missing path from becoming a false green.
      - name: reject bypasses in crates/aion-awl
        run: |
          test -d crates/aion-awl
          ! grep -rnE '#!?\[(allow|expect)|#\[ignore|include!\(' crates/aion-awl/

  # Every nested standalone crate (own Cargo.lock, NOT a workspace member) gets
  # the same build/clippy/test bar as the workspace, run in its own directory.
  # These crates rot silently otherwise: no workspace gate compiles them, so an
  # aion-worker API change (or a crate rename) breaks them without any lane
  # going red — exactly what happened to norn-fan-worker (#181) and the
  # stacked-dev workers' test suites.
  standalone-crates:
    name: standalone crates (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - examples/norn-fan-worker
          - examples/stacked-dev/mixed-worker
          - examples/stacked-dev/norn-worker
          - examples/stacked-dev-remote/worker
          - .meridian/workflows/stacked-dev/worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: cargo build
        working-directory: ${{ matrix.crate }}
        run: cargo build
      # `!cancelled()` rather than separate jobs, and the difference from
      # `test-all-features` is the point: these three steps ask about the SAME code
      # under the SAME features, so one status per crate is the honest granularity —
      # what was missing is that an earlier failure hid the later results entirely.
      # Run 30192212491 showed exactly that for examples/stacked-dev-remote/worker:
      # `X cargo clippy` / `- cargo test`, so that crate's test result is unknown to
      # this day. Splitting these into jobs would recompile the crate three times to
      # answer questions that share one verdict; making them always run answers all
      # three in one pass.
      - name: cargo clippy --all-targets -- -D warnings
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.crate }}
        run: cargo test

  test:
    name: test (workspace, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Gleam-dependent tests gate-and-skip when the CLI is unavailable; install
      # Erlang/OTP + gleam so CI executes those tests for full coverage.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.17.0'
      - name: cargo test --workspace
        run: cargo test --workspace

  # SEPARATE JOB, not a second step of `test`. This is the ONLY lane in the whole
  # workflow that compiles a non-default feature — `libsql-backend` among them —
  # and as a trailing step of `test` it never ran: Actions stops a job at its
  # first failing step, so a single brittle default-feature test silently deleted
  # this entire coverage dimension while reporting itself as the only failure.
  # That is how four `libsql-backend` tests stayed red for 91 commits: the lane
  # that looks never got to look.
  #
  # `continue-on-error` / `if: always()` would NOT be the fix here. They keep both
  # results fused into one job status, so a genuine all-features failure still
  # reads as "that flaky default-feature test again". A coverage dimension nobody
  # can see the status of is not gated.
  test-all-features:
    name: test (workspace, --all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.17.0'
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

  awl-check:
    name: aion awl check (checker fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: aion awl check (checker fixtures)
        run: |
          cargo build -p aion-cli --bin aion -q
          B=target/debug/aion
          s=0
          for f in \
            crates/aion-awl/tests/fixtures/hello.awl \
            crates/aion-awl/tests/fixtures/research_report.awl \
            crates/aion-awl/tests/fixtures/research_report.canonical.awl
          do
            "$B" awl check "$f" || { echo "MUST-PASS FAILED: $f"; s=1; }
          done
          # AWL1-004 adds typed child contracts; when it lands, move both
          # bounded_cycle fixtures into the must-pass set and retire this carve-out.
          for f in \
            crates/aion-awl/tests/fixtures/bounded_cycle.awl \
            crates/aion-awl/tests/fixtures/bounded_cycle.canonical.awl
          do
            test -f "$f" || { echo "EXPECTED-FAIL FIXTURE MISSING: $f"; s=1; continue; }
            if "$B" awl check "$f"; then
              echo "EXPECTED-FAIL NOW GREEN (AWL1-004 landed - retire carve-out): $f"
              s=1
            fi
          done
          exit "$s"

  # Types-first drift gate (ADR-014): the committed examples/order-saga must
  # be byte-current against what `aion generate` derives from its authored
  # types module — codecs module, emitted schemas, wrappers, worker, golden,
  # and the workflow.toml activities list. A hand-edit to any generated
  # artifact (or a type edit committed without regenerating) fails here
  # naming the drifted file. Additive job: composes with the other lanes.
  codegen-drift:
    name: codegen-drift (aion generate --check on examples/order-saga)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `aion generate` drives the real Gleam toolchain (interface export +
      # manifest probe), so the BEAM + gleam must be present.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.17.0'
      - name: aion generate --check (examples/order-saga)
        run: cargo run -p aion-cli --bin aion -- generate examples/order-saga --check

  # The Python SDKs get the same bar as the workspace, run in their own
  # directory — for exactly the reason the `standalone-crates` lane above
  # exists, and then some.
  #
  # Nothing in the Rust build references these packages, so a wire-contract
  # change breaks them with no lane going red. That is not hypothetical: the
  # worker SDK was wire-dead for an unknown period while its own suite stayed
  # green, because its committed protobuf stubs were never regenerated and the
  # tests therefore validated it against a fossil of the protocol. Agreement
  # was preserved exactly while correctness was lost.
  #
  # Both packages now carry the gate that catches that class — it regenerates
  # the stubs and byte-compares them against what is committed
  # (`aion-worker/tests/test_proto_contract_location.py`,
  # `aion-client/tests/test_proto_contract.py`). This job is what makes those
  # gates real rather than something a developer might remember to run.
  #
  # The caller SDK went the same way for longer and less visibly: proto3
  # tolerates missing fields, so nothing broke — it simply could not reach the
  # start-routing fields, the pause/resume/reopen RPCs, or four error codes, and
  # every test passed throughout.
  python-sdks:
    name: python SDKs (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - sdks/python/aion-worker
          - sdks/python/aion-client
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Both packages need the Rust tree in the checkout: the worker SDK
      # generates its stubs from `crates/aion-proto-generated` at build time,
      # and both packages' staleness gates regenerate from it at test time. It
      # is there — but the dependency is easy to miss and is the thing that
      # broke before.
      - name: pytest
        working-directory: ${{ matrix.package }}
        run: uv run --extra dev python -m pytest tests/ -q

  # The TypeScript SDKs had NO lane at all — not a shadowed one, none. Their
  # `typecheck`, `lint`, `test` and (for the worker) `check:proto` scripts have
  # been present and passing on a developer's machine and invoked by nothing.
  #
  # `check:proto` is the same class of gate as the Python packages' staleness
  # tests: it regenerates from the authoritative proto contract and compares
  # against what is committed. It exists ONLY in `aion-worker`.
  #
  # ⚠️ Read this lane for what it can and cannot say. Every one of these gates is
  # green today, and for `aion-client` that greenness cannot answer the fossil
  # question, because that package has no drift check to run. Its 32 tests
  # validate the client against its own committed stubs, and its live-server
  # conformance skips at runtime when `AION_SERVER_URL` is unset — which is the
  # honest thing for it to do and is exactly the shape that let the Rust and
  # Python caller SDKs sit wire-dead while passing. Building `aion-client` a
  # drift gate is the remaining work in #67; this lane does not stand in for it.
  #
  # **bun, installed once at the workspace root** — not npm per package. The repo
  # root is a private bun workspace (`aion-workspace`, members `apps/*` and
  # `sdks/typescript/*`) and `bun.lock` is the tracked lockfile. `npm ci` inside a
  # member directory cannot work: `npm prefix` there resolves to the repo root, so
  # npm looks for a lockfile at the root and ignores any local one. Verified by
  # running it, which is the only reason this comment is right.
  typescript-sdks:
    name: TypeScript SDKs (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - sdks/typescript/aion-worker
          - sdks/typescript/aion-client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # `--frozen-lockfile` because the lockfile is the point of a gate that is
      # meant to be reproducible: a resolution that drifts under CI is a gate
      # measuring something other than what is committed.
      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile
      # `!cancelled()` on every later step, for the reason set out on
      # `standalone-crates`: these ask about the same package under the same
      # inputs, so one status per package is the honest granularity — but a lint
      # failure must not hide whether the tests pass.
      - name: typecheck
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.package }}
        run: bun run typecheck
      - name: lint
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.package }}
        run: bun run lint
      - name: test
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.package }}
        run: bun run test

  # The proto-drift gate, in its own job so it reports for itself. It is the one
  # check here that can catch a fossil, and burying it among the pass/fail of
  # three other scripts would make its absence read as someone else's failure —
  # which is precisely how the `--all-features` lane went unnoticed.
  typescript-proto-drift:
    name: TypeScript worker proto drift (check:proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile
      # Regenerates from the authoritative proto contract in the Rust tree and
      # byte-compares against the committed `src/proto/`, so that tree must be in
      # the checkout. It is — but the dependency is easy to miss and is the thing
      # that broke before.
      - name: bun run check:proto
        working-directory: sdks/typescript/aion-worker
        run: bun run check:proto

  # ----------------------------------------------------------------------- #
  # SLOW LANE — the real OS-process failover gates (kill-9 + graceful). These
  # PASS on main since #157 (the per-shard failover seam now forwards through the
  # store decorators) and are MUST-PASS here (no continue-on-error). They run
  # nightly, on demand, and on PRs that touch the failover-critical code. The
  # graceful (non-kill9) osproc test is included here because no other lane runs
  # it (it is `#[ignore]`d, so the fast `cargo test` lanes skip it).
  # ----------------------------------------------------------------------- #

  kill9-failover:
    name: osproc failover gates (slow, post-#157 regression guards)
    runs-on: ubuntu-latest
    needs: changes
    # Always run on schedule / workflow_dispatch / push-to-main; on a PR run only
    # when that PR touches the failover-critical code (see the `changes` job).
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.failover == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.17.0'
      # Three INDEPENDENT failover guarantees. Sequenced steps rather than jobs
      # because they share one expensive build, but `!cancelled()` so the first one
      # failing does not hide whether the other two hold — which is the whole
      # question this lane exists to answer.
      - name: lsub5b kill-9 reconnect-to-survivor failover
        run: >-
          cargo test -p aion-cli --features haematite-backend,liminal-transport
          --test lsub5b_osproc_kill9_failover_e2e -- --ignored --nocapture
      - name: parked-timer kill-9 failover
        if: ${{ !cancelled() }}
        run: >-
          cargo test -p aion-cli --features haematite-backend,liminal-transport
          --test parked_timer_osproc_kill9_failover_e2e -- --ignored --nocapture
      - name: lsub5b graceful osproc failover (non-kill9 — no fast lane runs it)
        if: ${{ !cancelled() }}
        run: >-
          cargo test -p aion-cli --features haematite-backend,liminal-transport
          --test lsub5b_osproc_failover_e2e -- --ignored --nocapture
