[workspace]
resolver = "2"
members = [
    "crates/aion-awl",
    "crates/aion-awl-lsp",
    "crates/aion-awl-package",
    "crates/aion-core",
    "crates/aion-store",
    "crates/aion-store-haematite",
    "crates/aion-package",
    "crates/aion-toolchain",
    "crates/aion",
    "crates/aion-proto",
    "crates/aion-proto-generated",
    "crates/aion-mcp",
    "crates/aion-server",
    "crates/aion-darwin-acl",
    "crates/aion-worker",
    "crates/aion-client",
    "crates/aion-integrations",
    "crates/aion-integration-norn",
    "crates/aion-integration-cli",
    "crates/aion-integration-acp",
    "crates/aion-cli",
    "benchmarks/million-processes",
    "xtask",
]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/ablative-io/aion"
authors = ["Tom Whiting <tom@ablative.com.au>"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"

[workspace.dependencies]
serde = "1.0"
serde_json = "1.0"
schemars = "1.0"
# Draft 2020-12 validation of declared contract schemas. `default-features =
# false` drops the network/file schema resolvers: a package's declared schemas
# are self-contained by construction, and admission must never reach outward.
jsonschema = { version = "0.46.6", default-features = false }
clap = "4"
thiserror = "2.0"
anyhow = "1.0"
uuid = "1.23"
url = "2"
chrono = "0.4"
signal-hook = "0.3.18"
async-trait = "0.1"
tokio = "1.52"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
sha2 = "0.11"
toml = "1.1"
toml_edit = "0.23"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
zip = "8.6"
tonic = "0.14"
tonic-build = "0.14"
prost = "0.14"
axum = "0.8"
tower = "0.5"
futures = "0.3"
tokio-tungstenite = "0.29.0"
dashmap = "6.2"
fs4 = "1.1"
notify = "8.2"
saffron = { version = "0.1", features = ["std"] }
hostname = "0.4"
# 0.19.3 is the estate-wide runtime floor. Keep the direct runtime and every
# storage/messaging wrapper on releases whose beamr requirements can unify at
# that floor; older 0.x requirements are disjoint and would retain unsafe
# runtimes in the resolved graph.
beamr = { version = "0.19.3", features = ["json", "encode"] }
haematite = "0.9.0"
# The crates.io 0.7.0 SDK manifest still selects liminal-rs 0.5.5 (and therefore
# beamr 0.16.3). Pin the complete liminal family to its immutable 0.9.0 release
# revision so shared wire types come from one source and its std transport uses
# liminal-rs 0.6.0.
liminal = { package = "liminal-rs", git = "https://github.com/ablative-io/liminal.git", rev = "8a36db0ccc36cb90ac5c29938eb9ed2b63b5ed63", version = "0.6.0" }
liminal-sdk = { git = "https://github.com/ablative-io/liminal.git", rev = "8a36db0ccc36cb90ac5c29938eb9ed2b63b5ed63", version = "0.7.0" }
liminal-server = { git = "https://github.com/ablative-io/liminal.git", rev = "8a36db0ccc36cb90ac5c29938eb9ed2b63b5ed63", version = "0.9.0" }
tempfile = "3.27.0"
tokio-stream = "0.1.18"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }
protoc-bin-vendored = "3.2.0"
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.7"
http = "1.4.1"
http-body-util = "0.1"
lsp-server = "0.8.0"
lsp-types = "0.97.0"
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8.11.0"
prometheus = "0.14.0"
base64 = "0.22.1"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }

# The full workspace gate compiles every target, including the server's large
# integration-test matrix. Debug info and incremental caches multiply that
# build into tens of gigabytes without affecting what the tests exercise.
# Keep gate builds compact enough to finish on bounded landing-desk storage.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
