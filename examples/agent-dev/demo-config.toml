# Server configuration for the agent-dev live demo (see RUNBOOK.md).
#
# Identical to the repo's dev-config.toml plus the outbox/liminal block the
# agent-dev worker requires: the worker connects IN to the server's liminal
# listener (server-push dispatch), so the outbox must be commissioned and the
# listener address set.

workflow_packages = []

[server]
listen_address = "127.0.0.1:8080"
grpc_address = "127.0.0.1:50051"

[store]
backend = "haematite"
data_dir = "aion-data"
# REQUIRED, no default — the server refuses to start without it, naming the
# missing field. "unlimited" is the pre-budget cache behaviour, stated out
# loud; write a byte bound (e.g. { bytes = 1073741824 }) once you know your box.
node_cache_budget = "unlimited"

[runtime]
query_timeout_ms = 10000

[observability]
# Both REQUIRED, no defaults. One durable commit re-persists the whole
# containing storage leaf, so the batch bounds are a write-amplification
# decision: max_batch_events is the most transcript events one durable
# commit carries; max_batch_hold_ms is how long a partial batch may be held
# open (bounds how much not-yet-durable transcript a crash can cost).
max_batch_events = 64
max_batch_hold_ms = 200

[namespaces]
default = "default"

[outbox]
enabled = true
liminal_listen_address = "127.0.0.1:50061"

[deploy]
enabled = true
