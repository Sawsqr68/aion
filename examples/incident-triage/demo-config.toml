# Server configuration for the incident-triage DRIVEN-mode demo (see RUNBOOK.md).
#
# Identical to the repo's dev-config.toml plus the outbox/liminal block the
# driven worker requires: the worker connects IN to the server's liminal
# listener (server-push dispatch), so the outbox must be commissioned and the
# listener address set. The plain-mode worker uses the same server unchanged.

workflow_packages = []

[server]
listen_address = "127.0.0.1:8080"
grpc_address = "127.0.0.1:50051"

[store]
backend = "haematite"
data_dir = "aion-data"
# The three fields below are REQUIRED and have no defaults — the server
# refuses to start without them (exit 2, naming the missing field).
# "unlimited" is the pre-budget cache behaviour, stated out loud; write a
# byte bound (e.g. { bytes = 1073741824 }) once you know your box.
node_cache_budget = "unlimited"
# How long a node waits for the store lock before giving up (total patience)
# and how often it retries while waiting. Milliseconds; cadence <= patience.
lock_acquisition_patience_ms = 250
lock_acquisition_retry_cadence_ms = 5

[runtime]
query_timeout_ms = 10000

[observability]
# Both REQUIRED, no defaults. One durable commit re-persists the whole
# containing storage leaf, so the batch bounds are a write-amplification
# decision: max_batch_events is the most transcript events one durable
# commit carries; max_batch_hold_ms is how long a partial batch may be held
# open (bounds how much not-yet-durable transcript a crash can cost).
max_batch_events = 64
max_batch_hold_ms = 200

[namespaces]
default = "default"

[websocket]
event_broadcast_capacity = 1024

[outbox]
enabled = true
liminal_listen_address = "127.0.0.1:50061"

[deploy]
enabled = true
