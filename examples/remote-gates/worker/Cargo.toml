# Standalone Rust activity worker for the AWL-authored remote-gates workflow.
[package]
name = "remote-gates-worker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Aion worker that clones a repository and runs the Rust gate battery over it, returning structured findings."

[[bin]]
name = "remote-gates-worker"
path = "src/main.rs"

[lib]
name = "remote_gates_worker"
path = "src/lib.rs"

[workspace]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[dependencies]
aion-core = { path = "../../../crates/aion-core" }
aion-worker = { path = "../../../crates/aion-worker", features = ["liminal-transport"] }
anyhow = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
aion-awl = { path = "../../../crates/aion-awl" }
aion-package = { path = "../../../crates/aion-package" }
tempfile = "3"
