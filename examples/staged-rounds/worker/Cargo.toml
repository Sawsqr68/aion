# Rust activity worker for the staged-rounds workflow.
#
# Standalone (NOT a workspace member) so it builds from a plain `cargo build`
# in this directory, mirroring the `dev-brief` example worker.
#
# It serves ELEVEN activity types on ONE task queue (`staged_rounds`) across
# FIVE connections — one per NODE, because the server routes by (namespace,
# task_queue, node) and never by activity type:
#
# - FIVE DRIVEN AGENT activities (`planner`, `dev_item`, `review_item`,
#   `remediate`, `fix_integration`) on FOUR connections — each routed through
#   its connection's OWN composed harness: a `ProfiledNornHarness` that
#   dispatches on the activity type, assembles the prompt from the activity's
#   structured context JSON, and delegates to a `NornHarness` (driven mode,
#   jsonrpc) carrying the connection's `--output-schema`, its profile markdown
#   (loaded at startup from `--profiles-dir`) as `--append-system-prompt`, and
#   a per-run derived `--session-id`, over the liminal server-push transport
#   (`serve_with_redial`). `remediate` and `fix_integration` SHARE the
#   `remediation` node and connection: both RESUME the planner's session (same
#   `--session-id` suffix), so the persistent coordinator answers for its own
#   plan — for its items' merge conflicts, and for a merged union that is red
#   when every branch was green. Each `review_item` PANEL SEAT is its own
#   session (`review-<item>-<lens>`), so concurrent lenses over one item stay
#   blind to each other.
# - SIX SHELL-NODE activities (`provision_item`, `gate_item`, `plan_reviews`,
#   `fold_phase`, `merge_branches`, `verify_integration`) — typed registry
#   handlers for per-item worktree provisioning, the AUTHORITATIVE per-item
#   gate battery, the item × lens panel flattening, phase-state folding,
#   ordered branch merging, and the merged-tree battery re-run, on a fifth
#   connection with no harness. The two batteries report each gate command's
#   start and exit status on the activity's heartbeat progress channel.
[package]
name = "staged-rounds-worker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust worker serving eleven staged-rounds activities: five driven Norn agent roles and six shell-node handlers."

[[bin]]
name = "staged-rounds-worker"
path = "src/main.rs"

[lib]
name = "staged_rounds_worker"
path = "src/lib.rs"

[workspace]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"

[dependencies]
# The `liminal-transport` feature enables the server-push serve path
# (`serve_with_redial`) the driven agent-harness wiring runs on. The composed
# agent-harness seam is unpublished, so the aion crates are consumed by PATH.
aion-worker = { path = "../../../crates/aion-worker", features = ["liminal-transport"] }
aion-integration-norn = { path = "../../../crates/aion-integration-norn" }
aion-integrations = { path = "../../../crates/aion-integrations" }
# The AWL document embedded in `src/declaration.rs` is the ONE source of the
# wire schemas this worker advertises, so its compiler is a production
# dependency, not a test one: `aion_awl::compile` runs once at startup and every
# registered descriptor comes from the contract it returns. Deriving those
# schemas from the Rust types instead would create a second rendering of the
# same shapes — exactly the drift the server's contract gate exists to catch.
aion-awl = { path = "../../../crates/aion-awl" }
# `ActivityDescriptor`/`WorkerContract` (the advertisement types) and
# `contract_diffs` (the server's own admission function, which the composition
# root's tests admit against).
aion-package = { path = "../../../crates/aion-package" }
anyhow = "1"
async-trait = "0.1"
# The harness wrapper implements `AgentSession` itself (to run the
# developer's post-turn commit and the remediator's merge conclusion), whose
# event stream is a futures BoxStream.
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The direct-path compile proof drives the same seam `aion deploy` uses.
aion-awl-package = { path = "../../../crates/aion-awl-package" }
jsonschema = { version = "0.46.6", default-features = false }
tempfile = "3"
